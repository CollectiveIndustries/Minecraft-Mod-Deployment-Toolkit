# ---------------------------------------------------------------------
# Configuration for deploy_pack.py
# ---------------------------------------------------------------------
# All paths can be absolute or relative to the working directory.
#
# SECRETS (Discord webhook URL, etc.) do NOT belong in this file.
# Put them in config.d/.env (gitignored), using the same flat key names
# as this file:
#
#     webhook_url=https://discord.com/api/webhooks/xxx/yyy
#
# LAYOUT NOTE: top-level keys must all appear BEFORE the first [table]
# header. In TOML, any key that follows a [section] header belongs to
# that section. The instances tables are last for this reason.

# === Core paths ========================================================

# Source tree for config, kubejs, resourcepacks, and any other items
# listed under [sync_mapping].
sync_root = "./sync"

# Prism modpack directory. The .index subfolder holds the .pw.toml
# metadata; the jars themselves live alongside it.
modpack_dir = "./sync/downloads"

# Public web directory. Receives the client ZIP, the changelog HTML,
# and any @www/... shared items. If omitted, deploy_pack derives it from
# the compose file's /usr/share/nginx/ bind mount, provided exactly one
# candidate exists. Setting it explicitly is recommended.
www_dir = "./www"

# File listing paths that must never be deleted during a clean deploy
# (server-authored files that live only at the target, not in git). A
# missing file is a silent no-op. Format: one glob per line; # comments.
protect_file = "./.deploy_protect"

# Template for the client ZIP filename. {date} -> YYYYMMDD.
output_filename = "minecraft_client_{date}.zip"

# Public base URL for www_dir. Used to build the client ZIP URL, the
# changelog URL, and the resource-pack URL written into server.properties.
download_base_url = "http://minecraft/downloads"

# Shared mods directory, as declared in compose. This key is read only
# for a drift warning: deploy_pack derives mods_dir from the /data/mods
# bind mount and logs a warning if the two disagree. Compose wins.
mods_dir = "./mods"

# === Sync mapping ======================================================
# Maps top-level items in sync_root to destination paths.
#
#   "config"                  -> every instance at <instance_root>/config
#   { server = "x", client = "y" }  -> per-side destination
#   -1                        -> excluded for that side
#   "@www/..."                -> shared under www_dir
#
# The resourcepacks key uses a specific shape: it must have a
# "resource_pack" key (the @www/ destination for the server-side pack
# publication) and a "client" key (the source directory under sync_root
# for the client-side staging). scope_resource_pack and scope_client
# read those keys directly, not via per-side resolution.
#
[sync_mapping]
config = "config"
kubejs = "kubejs"
resourcepacks = { resource_pack = "@www/resourcepacks", client = "resourcepacks" }

# === Restart policy ====================================================
# Per-path action for server-scope changes. Keys are glob patterns,
# matched by longest literal prefix then by total pattern length. Values
# are one of:
#
#   none         - no action
#   none+pack    - no lifecycle action; mark client pack stale
#   reload       - RCON "reload"
#   reload+pack  - RCON "reload"; mark client pack stale
#   restart      - stop + start via Docker
#   restart+pack - restart; mark client pack stale
#
# Unlisted paths default to "restart".
#
[restart_policy]
"config/*" = "restart"
"kubejs/client_scripts/*" = "none+pack"
"kubejs/server_scripts/*" = "reload"
"kubejs/startup_scripts/*" = "restart+pack"
"kubejs/assets/*" = "none+pack"
"kubejs/data/*" = "reload"
"mods/*" = "restart+pack"

# === Docker ============================================================
# Docker lifecycle timing and in-game notices.
#
# rcon_host is optional. When unset, deploy_pack uses the local docker
# socket and requires the RCON port to be published to localhost. When
# set, preflight requires exactly one published mapping for that port.
#
[docker]
compose_file = "docker-compose.yml"
restart_wait_seconds = 60
in_game_notice_required = true
health_timeout_seconds = 600
health_poll_seconds = 5
preflight_restarting_wait_seconds = 10
cancel_notice_ready_timeout_seconds = 5
restart_notice_template = "Server is restarting in {time} - please log out."
restart_cancel_notice_template = "Restart cancelled - stay logged in."
# rcon_host = "10.0.0.5"

# === Discord ===========================================================
# Templates are validated at preflight when --notify is active. Only
# the placeholders defined for each context are accepted; unknown or
# cross-template placeholders are a preflight failure.
#
#   live:       {tool_version} {timestamp} {requested_scopes}
#               {instance_count} {instance_list} {dry_run_marker}
#               {player_tags} {operator_tags}
#               {section_server} {section_client} {section_resource_pack}
#   online:     {tool_version} {timestamp} {player_tags}
#               {container_status}
#   failure:    {tool_version} {timestamp} {operator_tags}
#               {failure_stage} {error} {container_status}
#   diagnostic: {tool_version} {timestamp}
#
# The webhook URL itself lives in config.d/.env as `webhook_url`.
# Role IDs are Discord role IDs; empty lists disable mentions.
#
[discord.tags]
player_roles = ["1553218245186691172"]
operator_roles = ["766124262616465508"]

[discord.messages.live]
template = """
{player_tags} **Minecraft Deployment**

{section_server}

{section_client}

{section_resource_pack}

{dry_run_marker}
Completed {timestamp}

Built by deploy_pack {tool_version}
"""

[discord.messages.online]
template = """**Deploy online**
{tool_version} @ {timestamp}"""

[discord.messages.failure]
template = """**Deploy failed**
stage: {failure_stage}
error: {error}
{tool_version} @ {timestamp}"""

[discord.messages.diagnostic]
template = """**Deploy diagnostic**
{tool_version} @ {timestamp}"""

# === Server instances ==================================================
# Each instance's container name must match a container_name in
# docker-compose.yml. The instance_root, config path, kubejs path, and
# server.properties path are derived from the compose service's /data
# bind mount - there is no separate "path" key in this file.
#
# config_mode: "merge" (default) or "delete" - §7.2 semantics for
#              <instance_root>/config.
# kubejs_mode: must be "delete" (the only value the spec defines).
#
# The partition is derived from these tables: every instance listed here
# is deployed. Use --instance to target a subset at runtime.
#
# These tables are intentionally last. See the layout note at the top.
#
[instances.survival]
container = "mc-survival"

[instances.creative]
container = "mc-creative"

# === Resource packs (optional, per instance) ===========================
# When present, the resource-pack scope publishes the named ZIP from
# sync_root/<sync_mapping.resourcepacks.client>/ and updates that
# instance's server.properties with the four managed keys. When absent,
# the instance is reported in no_pack_members and left untouched.
#
# [resource_pack.survival]
# filename = "survival-pack.zip"
# required = true
# prompt = "This pack is required to play on this server."