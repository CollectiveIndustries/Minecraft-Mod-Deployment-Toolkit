# ---------------------------------------------------------------------
# Configuration for deploy_pack.py
# ---------------------------------------------------------------------
# This file controls the modpack deployment tool.
# All paths can be absolute or relative to the working directory.
#
# SECRETS (Discord webhook URL, etc.) do NOT belong in this file.
# Put them in config.d/.env (gitignored), using the same flat key names
# as this file:
#
#     webhook_url=https://discord.com/api/webhooks/xxx/yyy
#
# The .env file is loaded with ConfigCore's file loader, so its keys are
# used literally. No prefix stripping, no dot expansion.
#
# LAYOUT NOTE: top-level keys must all appear BEFORE the first [table]
# header. In TOML, any key that follows a [section] header belongs to
# that section, so a flat key placed after [instances.*] silently ends
# up nested and config.get("key") returns None. This is why the
# instances tables are at the very bottom of the file.

# === Core paths ========================================================

# Directory where mods, configs, and other assets are synced from.
sync_root = "./sync"

# Shared mods directory. Server-side mods are deployed here ONCE and
# bind-mounted into every instance's /data/mods by Docker Compose.
mods_dir = "./mods"

# Public web directory. Receives resourcepacks, the client ZIP, BlueMap, etc.
www_dir = "./www"

# File containing rsync-style exclude patterns (e.g., *.bak, *.tmp).
# Applied recursively during both staging and live deployment.
exclude_file = "./.rsync_exclude"

# File listing paths that must NEVER be deleted during a clean deploy
# (server-authored files that live only at the target, not in git).
# Committed to the repo. Same format as the exclude file.
# A missing file causes the clean phase to abort rather than silently
# delete everything - see file_utils.get_protect_patterns for details.
protect_file = "./.deploy_protect"

# Template for the output ZIP filename. {date} -> YYYYMMDD.
# If you want same-day builds to coexist, use a timestamp:
#     "minecraft_client_{date}_%H%M%S.zip"
output_filename = "minecraft_client_{date}.zip"

# Directory where mod JAR files are stored (populated by PrismLauncher).
# The .index subfolder inside this dir holds the Prism .pw.toml metadata.
modpack_dir = "./sync/downloads"

# === MultiMC client deployment ==========================================
# Used only in client mode (--client).

# Base path to the MultiMC instances folder.
multimc_base = "/home/admiral/.local/share/multimc/instances"

# Name of the MultiMC instance to deploy to.
instance_name = "Mike_N_Ike"

# === Client pack notification ==========================================
# After the client ZIP is written, deploy_pack generates an HTML
# changelog page in www_dir and posts a short announcement to Discord
# pointing at that page. The page carries the download link, the
# SHA-256, and the diff between this client pack and the previous one.
#
# The webhook URL itself is a secret and lives in config.d/.env as
# `webhook_url`. The keys below are non-secret.
#
# A failed notification is logged but never fails the deploy.

# Public base URL for www_dir. The changelog and client ZIP URLs are
# built as `{download_base_url}/{filename}`. Set this to the URL that
# actually serves the contents of www_dir.
download_base_url = "http://minecraft/downloads"

# Placeholders available in the message template:
#   {artifact}       - client ZIP filename
#   {url}            - direct download URL (download_base_url + artifact)
#   {changelog_url}  - URL of the generated changelog HTML page
#   {sha256sum}      - SHA-256 of the client ZIP
#   {timestamp}      - build time, UTC
#   {summary}        - one-line teaser, e.g. "3 mods added - 5 KubeJS
#                      files modified"
#
# The message body is trimmed at a blank-line boundary if it exceeds
# Discord's 2000 character limit.

webhook_message_template = """
**Minecraft Client Pack Published**

**Update notes:** {changelog_url}
**Download:** {url}

**SHA-256**
`{sha256sum}`

**Summary**
{summary}

Built {timestamp} UTC
"""

# === Sync mapping ======================================================
# Maps top-level items in `sync_root` to destination paths.
#
# Destination rules:
#
#   "config"                  -> deployed to EVERY instance at <instance.path>/config
#   { server = "server/x",
#     client = "client/x" }   -> per-side destination (relative to instance, or shared)
#   -1                        -> excluded for that side
#
# Shared destinations (not per-instance) are prefixed with '@':
#
#   "@www/resourcepacks"      -> www_dir/resourcepacks
#   "@www/foo/bar"            -> www_dir/foo/bar
#   "@mods/foo"               -> mods_dir/foo   (rarely needed - see note above)
#
[sync_mapping]
# These go to every instance (survival AND creative) at the same rel path.
config = "config"
kubejs = "kubejs"

# resourcepacks: server-side publishes into the public www dir;
# client-side stays relative so it ends up inside the client ZIP.
resourcepacks = { server = "@www/resourcepacks", client = "resourcepacks" }

# You can disable a side entirely:
# "some_folder" = { server = -1, client = "some_folder" }

# === Logging configuration =============================================

[logging]
color = true
handlers = [
    { type = "console", color = true },
    { type = "file", path = "logs/deploy_pack.log", max_bytes = 10485760, backup_count = 5 }
]

# === Server instances ==================================================
# Each instance receives its own copy of every instance-mapped sync item
# (config, kubejs, etc.). Mods are shared from `mods_dir` - do NOT put a
# mods mapping here.
#
# Two equivalent forms are supported:
#
#   [instances.survival]        instances = {
#   path = "./survival"             survival = "./survival",
#                                   creative = "./creative",
#                               }
#
# NOTE: these tables are intentionally last. See the layout note at the
# top of the file.

[instances.survival]
path = "./survival"

[instances.creative]
path = "./creative"