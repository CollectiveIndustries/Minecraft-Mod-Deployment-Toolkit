# nginx-artifact-store.conf
#
# Serves sync/downloads over HTTP for DEV-side artifact inspection.
# Read-only. Placeholder for the eventual proper artifact repository store.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }
}