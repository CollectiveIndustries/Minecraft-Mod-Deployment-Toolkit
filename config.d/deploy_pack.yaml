# =============================================================================
# deploy_pack.yaml – Configuration for the Minecraft client pack deployer
# =============================================================================

# ---- Server-side source directories (absolute paths) ----
# Where the authoritative client files live on the server
sync_root: /home/admiral/minecraft/sync          # contains client/ and config/ subdirectories
live_server: /home/admiral/minecraft/server      # contains kubejs/ and config/ftbquests/

# ---- Output directory for the ZIP (server mode only) ----
www_dir: /home/admiral/minecraft/www             # the ZIP will be placed here

# ---- Exclude patterns file ----
# Path to a file with fnmatch patterns (one per line) to skip when packaging.
exclude_file: /home/admiral/nfs/sync/.rsync_exclude

# ---- Output ZIP filename template ----
# {date} will be replaced with YYYYMMDD
output_filename: "minecraft_client_{date}.zip"

# ---- MultiMC settings (only used with --client) ----
# Base directory where MultiMC stores instances.
# If not set, defaults to ~/.local/share/multimc/instances
multimc_base: /home/admiral/.local/share/multimc/instances

# Name of the MultiMC instance (e.g., "Mike_N_Ike").
# Required for client mode; must exist under multimc_base/instances/
instance_name: Mike_N_Ike

# ---- Logging configuration ----
logging:
  color: true   # use ANSI colours in console output

  # Handlers: at least one console handler, and optionally a file handler with rotation
  handlers:
    - type: console
      color: true
    - type: file
      path: logs/deploy_pack.log
      max_bytes: 10485760   # 10 MiB; set to 0 to disable rotation
      backup_count: 5       # keep 5 rotated archives