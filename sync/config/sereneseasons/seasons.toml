[aesthetic_settings]
	# Change foliage colour based on the current season.
	# This gives the world visible seasonal progression without using a real-world calendar.
	change_foliage_color = true

	# Change grass colour based on the current season.
	change_grass_color = true

	# Change birch foliage colour based on the current season.
	change_birch_color = true


[dimension_settings]
	# Seasons only apply to dimensions listed here.
	# Keep seasonal simulation limited to the Overworld.
	whitelisted_dimensions = ["minecraft:overworld"]


[weather_settings]
	# Change the frequency of rain, snow, and storms based on the season.
	# This provides different weather patterns throughout the Minecraft year.
	change_weather_frequency = true

	# Generate snow and ice during the Winter season.
	generate_snow_ice = true


[time_settings]
	# The starting sub-season for new worlds.
	#
	# 0 = Random
	# 1 - 3 = Early/Mid/Late Spring
	# 4 - 6 = Early/Mid/Late Summer
	# 7 - 9 = Early/Mid/Late Autumn
	# 10 - 12 = Early/Mid/Late Winter
	#
	# Start new worlds in Early Spring so the pack has a predictable beginning
	# while still progressing naturally through all four seasons.
	starting_sub_season = 1

	# Duration of each sub-season in Minecraft days.
	#
	# There are 12 sub-seasons:
	#   3 Spring
	#   3 Summer
	#   3 Autumn
	#   3 Winter
	#
	# 8 Minecraft days per sub-season produces:
	#   24 Minecraft days per season
	#   96 Minecraft days per complete year
	#
	# Better Days controls how long a Minecraft day takes in real time.
	sub_season_duration = 8

	# Continue seasonal progression even when no players are online.
	#
	# This keeps the world calendar continuous instead of pausing the season
	# whenever the server is empty.
	progress_season_while_offline = true

	# Internal Minecraft day length used by the season cycle.
	#
	# Keep this at the normal Minecraft day length of 24000 ticks.
	# Better Days controls the real-world duration of those ticks:
	#   15 minutes of daytime
	#   15 minutes of nighttime
	#   30 minutes per complete Minecraft day
	#
	# Do NOT increase this to match the 30-minute real-world day.
	day_duration = 24000


# melt_percent:
#   Percentage chance that a selected snow or ice block melts.
#   100.0 = 100%
#   50.0  = 50%
#
# melt_rolls:
#   Number of snow/ice blocks randomly selected in each chunk per tick.
#   Higher values are not recommended on servers.
#   0 disables melting for that season.
#
# biome_temp_adjustment:
#   Amount to adjust biome temperature by.
#   Range: -10.0 to 10.0
#
# min_rain_time / max_rain_time:
#   Minimum and maximum time interval between rain events in ticks.
#   -1 disables rain.
#
# min_thunder_time / max_thunder_time:
#   Minimum and maximum time interval between thunder events in ticks.
#   -1 disables thunder.
#
# grass_colour:
#   Grass colour from 0 to 0xFFFFFF (16777215).
#
# grass_saturation:
#   Grass colour saturation multiplier.
#   -1 disables the saturation override.
#
# foliage_colour:
#   Foliage colour from 0 to 0xFFFFFF (16777215).
#
# foliage_saturation:
#   Foliage colour saturation multiplier.
#   -1 disables the saturation override.
#
# birch_color:
#   Birch foliage colour from 0 to 0xFFFFFF (16777215).
#   Uses the same saturation multiplier as foliage_colour.


