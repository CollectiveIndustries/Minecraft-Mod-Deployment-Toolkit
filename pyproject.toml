[project]
name = "minecraft"
version = "0.1.0"
description = "Minecraft Docker network"
authors = [
    {name = "Andrew Malone",email = "admmorketh@gmail.com"},
]
dependencies = [
    "mcstatus>=14.0.0",
    "collective-cores",
    "nbtlib>=2.0.4",
    ]


requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
deploy-pack = "minecraft.deploy_pack:main"
lookup-assets = "minecraft.lookup:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pdm.scripts]
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check . --fix"
tests = "pytest"

full.composite = [
    "pipeline",
    "docstring-fixer --workers 2 --retry 5 --mode opendeep --exclude 'tests/.*/fixtures/' src/ tests/",
    "format",
    "lint-fix",
    "lint",
    "tests",
    "risky-files --coverage coverage.json --quiet --filter \"risk > 2.0\" --sort complexity:desc",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
#    "-q",
    "--cov=src",           # measure coverage for all packages
    "--cov-report=term:skip-covered",        # terminal report
    "--cov-report=html",        # HTML report (htmlcov/)
    "--cov-report=json",         # json report (coverage.json)
    "--cov-fail-under=90",      # fail if below 90%
    "--no-cov-on-fail",
]
log_cli_level = "ERROR"
log_format = "%%(asctime)s %%(levelname)s %%(message)s"
log_date_format = "%%Y-%%m-%%d %%H:%%M:%%S"
cache_dir = ".cache"
asyncio_mode = "auto"

filterwarnings = [
]

markers = [
    "e2e: marks tests as end-to-end (deselect with '-m \"not e2e\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage]
# Only include the package source, exclude tests
source = ["src"]
# Exclude any files you don't want to count (e.g., __init__.py, test helpers)
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.pdm]
distribution = true

[tool.ruff]
target-version = "py313"
line-length = 160

exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "debug",
    "logs",
    "backups",
    "tests/**/fixtures/**",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "B",                # bugbear
    "I",                # import sorting
    "UP",               # pyupgrade
    "SIM",              # simplification
    "C4",               # comprehensions
    "C90",              # complexity
    "PLC", "PLE",       # pylint baseline checks
    "RUF",              # ruff rules
    "D",                # docstrings (MANDATORY POLICY)
    "TID"               # Enable Banned API see section bellow
]

ignore = [
    "E501",      # handled by formatter
    "B008",      # dependency injection patterns
    "B904",      # exception chaining flexibility
    "C901",      # allowed complexity in core services
    "PLR0912",   # branches
    "PLR0915",   # statements
    "SIM108",    # readability preference

    "D203", "D213",   # conflicting doc conventions
    "D105",           # dunder methods optional
    "D107",           # __init__ docstring optional
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pipeline]
dirs = "src,tests"
exclude = "tests/.*/fixtures/"

[tool.docstring-fixer]
mode = "opendeep"
batch_size = 5
delay_between_batches = 1.0
workers = 4
retry = 1
api_timeout = 240

# ----------------------------
# Unicode Handling (ENSURE ALL FILES ARE UTF-8 AND FREE OF NON-ASCII)
# ----------------------------
[tool.fix-unicode-ascii]
disable = ["0060"]           # backtick + en dash
enable = []                  # optional: re-enable some
normalize_accents = false    # keep false unless you want "café" -> "cafe"
#line_endings = "lf"      # or "crlf" tool.ruff.format.line-ending already handles this