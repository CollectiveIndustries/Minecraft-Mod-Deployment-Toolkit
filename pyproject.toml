[project]
name = "minecraft"
version = "0.2.1"
description = "Minecraft Docker network"
authors = [
    { name = "Andrew Malone", email = "admmorketh@gmail.com" },
]
dependencies = [
    "mcstatus>=14.0.0",
    "collective-cores",
    "nbtlib>=2.0.4",
    "pillow>=12.3.0",
    "textual>=8.2.8",
    "docker>=7.2.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
deploy-pack = "minecraft.deploy_pack.deploy_pack:cli"
lookup-assets = "minecraft.lookup:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pylint>=4.1.2",
    "docformatter>=1.7.8",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
format = "ruff format ."
docstrings-diff = "docformatter --diff src/"
docstrings-format = "docformatter --in-place src/"
lint = "ruff check ."
lint-fix = "ruff check . --fix"
pylint-duplicates = "pylint src/minecraft/"
tests = "pytest"

full.composite = [
    "pipeline",
    "docstring-fixer --workers 2 --retry 5 --mode opendeep --exclude 'tests/.*/fixtures/' src/ tests/",
    "format",
    "lint-fix",
    "lint",
    "tests",
    "risky-files --coverage coverage.json --quiet --filter \"risk > 2.0\" --sort complexity:desc",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term:skip-covered",
    "--cov-report=html",
    "--cov-report=json",
    "--cov-fail-under=90",
    "--no-cov-on-fail",
]
cache_dir = ".cache"
asyncio_mode = "auto"

filterwarnings = []

markers = [
    "e2e: marks tests as end-to-end (deselect with '-m \"not e2e\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.ruff]
target-version = "py313"
line-length = 160

exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "debug",
    "logs",
    "backups",
    "tests/**/fixtures/**",
]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle
    "F",       # pyflakes
    "W",       # pycodestyle warnings
    "B",       # flake8-bugbear
    "I",       # import sorting
    "UP",      # pyupgrade
    "SIM",     # simplification
    "C4",      # comprehensions
    "C90",     # McCabe complexity
    "PLC",     # pylint convention
    "PLE",     # pylint errors
    "RUF",     # Ruff-specific rules
    "D",       # docstrings
    "TID",     # tidy-imports / banned APIs
]

ignore = [
    "E501",   # line too long
    "B008",    # dependency injection patterns
    "B904",    # exception chaining flexibility
    "C901",    # allowed complexity in core services
    "PLR0912", # allowed branches
    "PLR0915", # allowed statements
    "SIM108",  # readability preference
    "D203",    # conflicts with D211 / project convention
    "D213",    # conflicts with D212 / project convention
    "D105",    # dunder methods optional
    "D107",    # __init__ docstring optional
    "D205",    # 1 blank line required before class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
line-ending = "lf"

[tool.pylint.main]
py-version = "3.13"

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 160

[tool.docformatter]
recursive = true
black = true
wrap-summaries = 148
wrap-descriptions = 148
exclude = [
    "fixtures",
]

[tool.pipeline]
dirs = "src,tests"
exclude = "tests/.*/fixtures/"

[tool.docstring-fixer]
mode = "opendeep"
batch_size = 5
delay_between_batches = 1.0
workers = 4
retry = 1
api_timeout = 240

[tool.fix-unicode-ascii]
disable = ["0060"]
enable = []
normalize_accents = false

[tool.risky-files]
max_complexity = 15
min_coverage = 70.0
max_risk = 5.0
fail_on = "complexity,coverage,risk,d-rank"