[project]
name = "minecraft"
version = "0.2.1"
description = "Minecraft Docker network"
authors = [
    { name = "Andrew Malone", email = "admmorketh@gmail.com" },
]
dependencies = [
    "mcstatus>=14.0.0",
    "collective-cores",
    "nbtlib>=2.0.4",
    "pillow>=12.3.0",
    "textual>=8.2.8",
    "docker>=7.2.0",
    "rfc8785>=0.1.4",
    "tomli-w>=1.2.0",
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
]
requires-python = ">=3.11,<3.16"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
deploy-pack = "minecraft.deploy_pack.deploy_pack:cli"
lookup-assets = "minecraft.lookup:main"
minecraft-upgrade = "minecraft.modpack_upgrade.cli.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pylint>=4.1.2",
    "docformatter>=1.7.8",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
format = "ruff format ."
docstrings-diff = "docformatter --diff src/"
docstrings-format = "docformatter --in-place src/"
lint = "ruff check ."
lint-fix = "ruff check . --fix"
pylint-duplicates = "pylint src/minecraft/"
tests = "pytest"

full.composite = [
    "pipeline",
    "docstring-fixer --workers 2 --retry 5 --mode opendeep --exclude 'tests/.*/fixtures/' src/ tests/",
    "format",
    "lint-fix",
    "lint",
    "tests",
    "risky-files --coverage coverage.json --quiet --filter \"risk > 2.0\" --sort complexity:desc",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term:skip-covered",
    "--cov-report=html",
    "--cov-report=json",
    "--cov-fail-under=90",
    "--no-cov-on-fail",
]
cache_dir = ".cache"
asyncio_mode = "auto"

filterwarnings = []

markers = [
    "e2e: marks tests as end-to-end (deselect with '-m \"not e2e\"')",
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]

[tool.coverage]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.ruff]
target-version = "py313"
line-length = 160

exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "debug",
    "logs",
    "backups",
    "tests/**/fixtures/**",
]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle
    "F",       # pyflakes
    "W",       # pycodestyle warnings
    "B",       # flake8-bugbear
    "I",       # import sorting
    "UP",      # pyupgrade
    "SIM",     # simplification
    "C4",      # comprehensions
    "C90",     # McCabe complexity
    "PLC",     # pylint convention
    "PLE",     # pylint errors
    "RUF",     # Ruff-specific rules
    "D",       # docstrings
    "TID",     # tidy-imports / banned API rules
    "T201",    # prohibit direct print() calls; use LoggingCore

    "ANN001",  # function arguments must be annotated
    "ANN002",  # *args must be annotated
    "ANN003",  # **kwargs must be annotated
    "ANN201",  # public functions must have return annotations
    "ANN202",  # private functions must have return annotations
    "ANN204",  # special methods must have return annotations
    "ANN205",  # static methods must have return annotations
    "ANN206",  # class methods must have return annotations
]

ignore = [
    "E501",    # Ruff formatter uses line-length as a target, not a hard limit
    "B008",    # dependency injection patterns
    "B904",    # exception chaining flexibility
    "C901",    # allowed complexity in core services
    "PLR0912", # allowed branches
    "PLR0915", # allowed statements
    "SIM108",  # readability preference

    "D203",    # conflicting docstring convention
    "D205",    # docformatter/Ruff formatting conflict
    "D213",    # conflicting docstring convention
    "D105",    # dunder methods optional
    "D107",    # __init__ docstring optional
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "TID251",
]

# The RoutingSink implementation writes to ``sys.stdout``/``sys.stderr``
# directly. That is the entire purpose of a sink: it is the boundary
# between LoggingCore and a stream. No other file may do this.
"src/minecraft/common/cli_logging.py" = ["TID251"]

# Dev-only proof-of-concept tools. Human-readable stdout is their
# interface; a proper logging system is deferred to a future upgrade.
"src/minecraft/audit_ores.py" = ["T201", "TID251"]
"src/minecraft/generate_drawers.py" = ["T201", "TID251"]
"src/minecraft/lookup.py" = ["T201", "TID251"]

[tool.ruff.lint.flake8-tidy-imports]
# Allow sibling relative imports, but prohibit imports from parent packages.
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging" = { msg = "Use your project's LoggingCore API instead of the standard-library logging module." }
"builtins.print" = { msg = "Use LoggingCore instead of explicitly calling builtins.print(). Bare print() calls are caught by T201." }
"pprint.pprint" = { msg = "Use LoggingCore instead of pprint.pprint()." }
"rich.print" = { msg = "Use LoggingCore instead of rich.print()." }
"sys.stdout" = { msg = "Use LoggingCore instead of writing directly to sys.stdout." }
"sys.stderr" = { msg = "Use LoggingCore instead of writing directly to sys.stderr." }



[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
line-ending = "lf"

[tool.pylint.main]
py-version = "3.13"

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 160

[tool.docformatter]
recursive = true
black = true
wrap-summaries = 148
wrap-descriptions = 148
exclude = [
    "fixtures",
]

[tool.pipeline]
dirs = "src,tests"
exclude = "tests/.*/fixtures/"

[tool.docstring-fixer]
mode = "opendeep"
batch_size = 5
delay_between_batches = 1.0
workers = 4
retry = 1
api_timeout = 240

[tool.annotation-fixer]
mode = "opendeep"
batch_size = 5
delay_between_batches = 1.0
workers = 4
retry = 1
api_timeout = 240

[tool.fix-unicode-ascii]
disable = ["0060"]
enable = []
normalize_accents = false

[tool.risky-files]
max_complexity = 15
min_coverage = 70.0
max_risk = 5.0
fail_on = "complexity,coverage,risk,d-rank"
