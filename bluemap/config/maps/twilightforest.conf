world: "/app/world"                     # <- main world folder with level.dat
dimension: "twilightforest:twilight_forest"   # <- TF dimension ID
name: "Twilight Forest"
sorting: 1
start-pos: { x: 0, z: 0 }
sky-color: "#7dabff"
void-color: "#000000"
sky-light: 1
ambient-light: 0.1
remove-caves-below-y: 55
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false
min-inhabited-time: 0
render-mask: []
render-edges: true
edge-light-strength: 8
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true
storage: "file"
ignore-missing-light-data: false
marker-sets: {}